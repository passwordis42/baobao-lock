<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>宝宝锁</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body class="app">
  <div class="stage">
    <div class="widget locked" id="widget">
      <div class="drag-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="ring-wrap" id="ringWrap">
        <svg class="ring" id="ring" viewBox="0 0 80 80" aria-hidden="true">
          <circle cx="40" cy="40" r="34" fill="none" stroke="#FFF0D0" stroke-width="6"></circle>
          <circle id="ringArc" cx="40" cy="40" r="34" fill="none" stroke="#F5C84C" stroke-width="6" stroke-linecap="round"></circle>
        </svg>
        <div class="mascot" id="mascot"></div>
      </div>
      <div class="badge" id="badge"><span class="dot"></span>已上锁</div>
      <div class="hint" id="hint"></div>
      <div class="emergency-copy" id="emergencyCopy">
        <div class="title">紧急解锁中…</div>
        <div class="sub">继续按住 <kbd>Esc</kbd></div>
        <div class="pct" id="pct">0.0 / 3 秒</div>
      </div>
    </div>
  </div>

  <template id="mascot-locked">
    <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" aria-label="锁宝 · 已上锁">
      <ellipse cx="36" cy="64" rx="22" ry="4" fill="rgba(255,107,149,0.18)"/>
      <path d="M24 30 V22 a12 12 0 0 1 24 0 v8" fill="none" stroke="#C48A9A" stroke-width="5" stroke-linecap="round"/>
      <path d="M24 30 V22 a12 12 0 0 1 24 0 v8" fill="none" stroke="#E8B4C4" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="16" y="28" width="40" height="32" rx="14" fill="#FF6B95"/>
      <rect x="18" y="30" width="36" height="28" rx="12" fill="#FF8AAB"/>
      <ellipse cx="24" cy="46" rx="4" ry="2.5" fill="#FFB4C8" opacity="0.9"/>
      <ellipse cx="48" cy="46" rx="4" ry="2.5" fill="#FFB4C8" opacity="0.9"/>
      <path d="M26 42 q3 -3 6 0" fill="none" stroke="#5C4A3A" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 42 q3 -3 6 0" fill="none" stroke="#5C4A3A" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 50 q4 4 8 0" fill="none" stroke="#5C4A3A" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="36" cy="40" r="3.2" fill="#FFF8F0" opacity="0.95"/>
      <rect x="34.6" y="41.5" width="2.8" height="5" rx="1.2" fill="#FFF8F0"/>
    </svg>
  </template>
  <template id="mascot-emergency">
    <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg" aria-label="锁宝 · 紧急解锁中">
      <path d="M17 22 V16 a9 9 0 0 1 18 0 v6" fill="none" stroke="#C48A9A" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="11" y="20" width="30" height="24" rx="10" fill="#FF8AAB"/>
      <ellipse cx="18" cy="34" rx="3" ry="2" fill="#FFB4C8"/>
      <ellipse cx="34" cy="34" rx="3" ry="2" fill="#FFB4C8"/>
      <circle cx="20" cy="30" r="2.2" fill="#5C4A3A"/>
      <circle cx="32" cy="30" r="2.2" fill="#5C4A3A"/>
      <circle cx="20.7" cy="29.3" r="0.7" fill="#fff"/>
      <circle cx="32.7" cy="29.3" r="0.7" fill="#fff"/>
      <path d="M23 36 q3 2.5 6 0" fill="none" stroke="#5C4A3A" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </template>
  <script src="../shared/format.js"></script>
  <script src="widget.js"></script>
</body>
</html>
