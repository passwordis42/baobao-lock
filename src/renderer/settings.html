<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>宝宝锁</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body class="app">
  <div class="window" role="dialog" aria-label="宝宝锁设置">
    <div class="titlebar">
      <div class="titlebar-left">
        <svg class="logo" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="22" height="22" rx="6" fill="#FFB4C8"/>
          <path d="M7 10 V8 a4 4 0 0 1 8 0 v2" fill="none" stroke="#5C3D4A" stroke-width="1.6" stroke-linecap="round"/>
          <rect x="5.5" y="9.5" width="11" height="8" rx="2.5" fill="#FF6B95"/>
          <circle cx="11" cy="13" r="1.3" fill="#FFF8F0"/>
        </svg>
        宝宝锁
      </div>
      <div class="win-btns" aria-hidden="true">
        <button type="button" class="dot" id="minBtn" aria-label="最小化"></button>
        <span class="dot idle"></span>
        <button type="button" class="dot close" id="closeBtn" aria-label="关闭"></button>
      </div>
    </div>
    <div class="body">
      <div class="hero">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="24" cy="44" rx="14" ry="2.5" fill="rgba(255,107,149,0.15)"/>
          <path d="M16 20 V15 a8 8 0 0 1 16 0 v5" fill="none" stroke="#C48A9A" stroke-width="3.2" stroke-linecap="round"/>
          <rect x="11" y="18" width="26" height="22" rx="9" fill="#FF8AAB"/>
          <ellipse cx="17" cy="30" rx="2.5" ry="1.6" fill="#FFB4C8"/>
          <ellipse cx="31" cy="30" rx="2.5" ry="1.6" fill="#FFB4C8"/>
          <circle cx="18.5" cy="27" r="1.8" fill="#5C4A3A"/>
          <circle cx="29.5" cy="27" r="1.8" fill="#5C4A3A"/>
          <circle cx="19.1" cy="26.4" r="0.55" fill="#fff"/>
          <circle cx="30.1" cy="26.4" r="0.55" fill="#fff"/>
          <path d="M21 32 q3 2.5 6 0" fill="none" stroke="#5C4A3A" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>宝宝锁</h1>
          <p>开会 / 直播时锁住键盘，鼠标照常用</p>
        </div>
      </div>

      <div class="banner" id="banner" hidden>
        键盘钩子未生效，现在没有锁住键盘。可以右键本程序，选择「以管理员身份运行」再试一次。
      </div>

      <div class="section">
        <div class="section-label">快捷键</div>
        <div class="row">
          <div>
            <div class="row-label">上锁</div>
            <div class="row-desc">默认组合，点击可改</div>
          </div>
          <button class="hotkey" type="button" id="lockBtn">Ctrl + Alt + K <small>改</small></button>
        </div>
        <div class="row">
          <div>
            <div class="row-label">解锁</div>
            <div class="row-desc">大人专用；紧急可长按 Esc 3 秒</div>
          </div>
          <button class="hotkey" type="button" id="unlockBtn">Ctrl + Alt + L <small>改</small></button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">反馈与挂件</div>
        <div class="row">
          <div>
            <div class="row-label">按错提示音</div>
            <div class="row-desc">解锁按错时小声提示</div>
          </div>
          <button class="toggle" type="button" id="tipSound" role="switch" aria-checked="true" aria-label="按错提示音 开"></button>
        </div>
        <div class="row">
          <div>
            <div class="row-label">挂件置顶</div>
            <div class="row-desc">始终浮在其他窗口之上</div>
          </div>
          <button class="toggle" type="button" id="alwaysOnTop" role="switch" aria-checked="true" aria-label="挂件置顶 开"></button>
        </div>
      </div>

      <p class="note">说明：上锁后会一并拦截 Alt+Tab、Win 键等；Ctrl+Alt+Del 无法拦截（系统安全桌面）。开机不会自动上锁。</p>
      <p class="error" id="error" hidden></p>

      <div class="foot">
        <button class="btn btn-ghost" type="button" id="cancelBtn">取消</button>
        <button class="btn btn-primary" type="button" id="saveBtn">保存</button>
      </div>
    </div>
  </div>
  <script src="../shared/format.js"></script>
  <script src="settings.js"></script>
</body>
</html>
