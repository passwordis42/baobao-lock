<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>宝宝锁 · 挂件 · 紧急解锁</title>
<style>
  :root {
    --cream: #FFF8F0;
    --pink: #FFB4C8;
    --pink-deep: #FF6B95;
    --mint: #A8E6CF;
    --mint-deep: #5ECF9A;
    --yellow: #FFE8A3;
    --text: #5C4A3A;
    --text-muted: #8B7355;
    --shadow: 0 8px 24px rgba(92, 61, 74, 0.18);
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 28px 36px;
    background:
      linear-gradient(135deg, #E8F4FF 0%, #FFF0F5 45%, #FFF8E7 100%);
    font-family: "Segoe UI", "Microsoft YaHei", "微软雅黑", sans-serif;
    color: var(--text);
  }
  .desk-hint {
    position: absolute; left: 32px; top: 28px;
    font-size: 12px; color: #9AA3B2;
  }
  .widget {
    width: 156px;
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 2px solid #FFE8A3;
    padding: 14px 12px 14px;
    text-align: center;
    position: relative;
  }
  .drag-dots {
    display: flex; justify-content: center; gap: 3px; margin-bottom: 6px;
  }
  .drag-dots span {
    width: 4px; height: 4px; border-radius: 50%; background: #E8C4D0;
  }
  .ring-wrap {
    position: relative; width: 80px; height: 80px; margin: 0 auto 8px;
  }
  .ring-wrap svg.progress {
    position: absolute; inset: 0; transform: rotate(-90deg);
  }
  .mascot {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
  }
  .title {
    font-size: 12px; font-weight: 700; color: #C48A20; margin-bottom: 2px;
  }
  .sub {
    font-size: 10px; color: var(--text-muted); line-height: 1.4;
  }
  .sub kbd {
    font-family: inherit;
    background: var(--cream);
    border: 1px solid #F0DCC8;
    border-radius: 4px;
    padding: 0 4px;
    font-size: 9px;
  }
  .pct {
    font-size: 11px; font-weight: 700; color: #E6A800; margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="desk-hint">桌面预览 · 长按 Esc 紧急解锁（约 1.8 / 3 秒）</div>
  <div class="widget">
    <div class="drag-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="ring-wrap">
      <svg class="progress" viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="34" fill="none" stroke="#FFF0D0" stroke-width="6"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="#F5C84C" stroke-width="6"
          stroke-linecap="round"
          stroke-dasharray="213.6"
          stroke-dashoffset="85.44"/>
      </svg>
      <svg class="mascot" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg" aria-label="锁宝 · 紧急解锁中">
        <path d="M17 22 V16 a9 9 0 0 1 18 0 v6" fill="none" stroke="#C48A9A" stroke-width="3.5" stroke-linecap="round"/>
        <rect x="11" y="20" width="30" height="24" rx="10" fill="#FF8AAB"/>
        <ellipse cx="18" cy="34" rx="3" ry="2" fill="#FFB4C8"/>
        <ellipse cx="34" cy="34" rx="3" ry="2" fill="#FFB4C8"/>
        <!-- focused eyes -->
        <circle cx="20" cy="30" r="2.2" fill="#5C4A3A"/>
        <circle cx="32" cy="30" r="2.2" fill="#5C4A3A"/>
        <circle cx="20.7" cy="29.3" r="0.7" fill="#fff"/>
        <circle cx="32.7" cy="29.3" r="0.7" fill="#fff"/>
        <path d="M23 36 q3 2.5 6 0" fill="none" stroke="#5C4A3A" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="title">紧急解锁中…</div>
    <div class="sub">继续按住 <kbd>Esc</kbd></div>
    <div class="pct">1.8 / 3 秒</div>
  </div>
</body>
</html>
